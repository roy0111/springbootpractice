# ── Application info ─────────────────────────────────────────────────────────
spring.application.name=restapi-learning
server.port=8080

# ── R2DBC (Reactive) Database ────────────────────────────────────────────────
# R2DBC URL format for H2 in-memory (non-blocking reactive driver)
spring.r2dbc.url=r2dbc:h2:mem:///productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=

# Schema initialization — Spring Boot runs schema.sql on startup
spring.sql.init.mode=always

# ── JPA/Hibernate is REMOVED — R2DBC is used instead ────────────────────────
# NOTE: H2 console requires Servlet stack; use /v3/api-docs or Swagger UI

# ── Spring Boot Actuator ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always

# Custom info at /actuator/info
management.info.env.enabled=true
info.app.name=Product Catalog Reactive REST API
info.app.description=Learning project - Reactive REST API + Actuator + Swagger
info.app.version=2.0.0
info.app.stack=Spring WebFlux + R2DBC + H2

# ── Springdoc / Swagger UI ───────────────────────────────────────────────────
# Swagger UI  → http://localhost:8080/swagger-ui.html
# OpenAPI JSON → http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ── Resilience4j Circuit Breaker ─────────────────────────────────────────────
#
# Circuit Breaker state machine:
#   CLOSED  ──(failures ≥ threshold)──▶  OPEN  ──(waitDuration)──▶  HALF_OPEN
#   HALF_OPEN ──(probe calls succeed)──▶  CLOSED
#   HALF_OPEN ──(probe calls fail)──────▶  OPEN
#
# Shared "default" configuration (inherited by all named instances)
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
# Show health in /actuator/health  (DOWN when OPEN)
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
# Which exceptions count as failures (network errors, not business 4xx)
resilience4j.circuitbreaker.configs.default.record-exceptions=\
  java.io.IOException,\
  java.net.ConnectException,\
  java.util.concurrent.TimeoutException,\
  org.springframework.web.reactive.function.client.WebClientRequestException
# Which exceptions are always ignored (do NOT count as failures)
resilience4j.circuitbreaker.configs.default.ignore-exceptions=\
  org.springframework.web.reactive.function.client.WebClientResponseException$NotFound

# ── externalApi instance (JSONPlaceholder calls) ──────────────────────────────
resilience4j.circuitbreaker.instances.externalApi.base-config=default
# More sensitive: open after 60% of last 5 calls fail
resilience4j.circuitbreaker.instances.externalApi.sliding-window-size=5
resilience4j.circuitbreaker.instances.externalApi.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.externalApi.wait-duration-in-open-state=15s

# ── blockingApi instance (legacy blocking executor calls) ─────────────────────
resilience4j.circuitbreaker.instances.blockingApi.base-config=default
resilience4j.circuitbreaker.instances.blockingApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.blockingApi.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.blockingApi.slow-call-duration-threshold=5s

# ── Spring AI — Anthropic Claude Configuration ───────────────────────────────
# API Key obtained from Anthropic Console (e.g. sk-ant-...)
# Uses system environment variable ANTHROPIC_API_KEY if available, or placeholder for testing.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:demo-api-key}
spring.ai.anthropic.chat.options.model=claude-3-5-sonnet-20240620
spring.ai.anthropic.chat.options.temperature=0.7

# ── Spring Kafka Configuration (Learning Example) ───────────────────────────
# Default localhost broker connection settings for learning/development.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=learning-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.concurrency=${KAFKA_CONCURRENCY:5}

# ── Spring Security OAuth2 Resource Server (JWT) ───────────────────────────
# Issuer URI for OIDC metadata discovery (or specify jwk-set-uri directly)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://auth.example.com/realms/master}
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://auth.example.com/realms/master/protocol/openid-connect/certs



